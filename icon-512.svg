<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1B5E3B"/>
  
  <!-- Three connected circles representing sharing -->
  <circle cx="256" cy="180" r="60" fill="none" stroke="#D4A843" stroke-width="20"/>
  <circle cx="148" cy="356" r="60" fill="none" stroke="#D4A843" stroke-width="20"/>
  <circle cx="364" cy="356" r="60" fill="none" stroke="#D4A843" stroke-width="20"/>
  
  <!-- Connecting lines -->
  <line x1="206" y1="226" x2="174" y2="302" stroke="#D4A843" stroke-width="16" stroke-linecap="round"/>
  <line x1="306" y1="226" x2="338" y2="302" stroke="#D4A843" stroke-width="16" stroke-linecap="round"/>
  <line x1="210" y1="356" x2="302" y2="356" stroke="#D4A843" stroke-width="16" stroke-linecap="round"/>
  
  <!-- MS monogram -->
  <text x="256" y="192" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#FAF7F2">MS</text>
</svg>
