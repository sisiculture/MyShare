<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="#1B5E3B"/>
  
  <!-- Basket/share symbol - three connected circles representing sharing -->
  <circle cx="96" cy="72" r="22" fill="none" stroke="#D4A843" stroke-width="8"/>
  <circle cx="58" cy="132" r="22" fill="none" stroke="#D4A843" stroke-width="8"/>
  <circle cx="134" cy="132" r="22" fill="none" stroke="#D4A843" stroke-width="8"/>
  
  <!-- Connecting lines -->
  <line x1="78" y1="88" x2="68" y2="114" stroke="#D4A843" stroke-width="6" stroke-linecap="round"/>
  <line x1="114" y1="88" x2="124" y2="114" stroke="#D4A843" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="132" x2="112" y2="132" stroke="#D4A843" stroke-width="6" stroke-linecap="round"/>
  
  <!-- MS monogram in centre top circle -->
  <text x="96" y="78" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#FAF7F2">MS</text>
</svg>
